---
{{- if .Values.rbac.createClusterRoleBinding }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: actasp-nginx-ingress
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: actasp-nginx-ingress
  namespace: actasp
roleRef:
  kind: ClusterRole
  name: actasp-nginx-ingress
  apiGroup: rbac.authorization.k8s.io
{{ end }}