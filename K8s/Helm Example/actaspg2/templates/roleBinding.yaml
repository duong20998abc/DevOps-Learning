kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: actaspg2-kubectl-cron
  namespace: {{ include "actaspg2.fullname" . }}
 subjects:
 - kind: ServiceAccount
   name: {{ include "actaspg2.serviceAccountName" . }}
   namespace: {{ include "actaspg2.fullname" . }}
 roleRef:
   apiGroup: rbac.authorization.k8s.io
   kind: Role
   name: actaspg2-kubectl-cron